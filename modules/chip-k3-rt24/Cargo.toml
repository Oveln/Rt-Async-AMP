[package]
name = "chip-k3-rt24"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
platform = { path = "../../rt-async/modules/platform" }
extern-trait = "0.4.3"
riscv = { version = "0.16.0", default-features = false, features = ["critical-section-single-hart"] }
fdt-parser = "0.4.19"
log = { version = "0.4", default-features = false }
ov-shm = { path = "../../modules/ov-shm" }
tock-registers = "0.10"

[features]
riscv64 = ["platform/riscv64"]
