[package]
name = "ov-rpc"
version = "0.2.0"
edition = "2024"
authors = ["oveln"]
description = "Type-safe RPC framework built on ov-channels for AMP systems"

[dependencies]
ov-channels = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
paste = { version = "1" }
log = { version = "0.4", default-features = false, optional = true }
# 原子计数用 portable-atomic 承载（标准 target 上别名 core 原生零变化；
# K3 专属 atomic-cas:false target 下经 critical-section 回退）。
portable-atomic = { version = "1", default-features = false }

[features]
default = []
logging = ["dep:log"]

[dev-dependencies]
ov-channels = { workspace = true, features = ["std", "flags"] }
