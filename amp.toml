# rt-async-amp 共享约定配置（QEMU 环境）
#
# 职责：QEMU 运行所需的地址布局（引导链 + 补丁 + loader）+ 上游 repo pin。
# 这些值作用于"能解析设备树的代码存在之前"的阶段——OpenSBI patch 编译期
# 变量、QEMU loader 摆放地址、链接脚本、DTB 扫描起点，设备树无法替代。
#
# 其余地址布局已由设备树承载（运行时 probe）：
#   - 共享内存窗口：its/rt-async-shm.dtsi（qemu 双端单一真相源）
#   - K3 外设/共享窗：its/rt-async-k3.dts（RP 侧）+ tgoskits AP dts
#   - K3 链接参数：apps/rt-async-k3/build.rs（本地常量）
# ioctl 等 /dev/rt_shm 软件 ABI：user-apps/rtshm-abi（内核侧 tgoskits 对齐义务）。
# 机器参数（machine/smp/ram）等环境属性：envs/<env>.toml。

# ── QEMU virt 256M RAM: 0x80000000 ~ 0x90000000 ─────────────────────────────
OPENSBIBASE  = "0x80000000"
STARRYOSBASE = "0x80200000"
RTASYNCBASE  = "0x82800000"
RTASYNCSIZE  = "0x800000"
# rt-async 专属 DTB 加载地址（esos 同款 handoff：QEMU loader 把 dtb 摆这里，
# board_init 从此地址扫描认领 compatible="ov,rt-async" 的 DTB）。
# 摆在 rt-async 8MB 区结束处，4KB 对齐，与 SHM 窗不冲突。
# 不变式：board_init 从此地址裸读 16 页(64KB) 扫描 DTB，故该区间必须落在
# QEMU virt RAM（0x80000000..0x90000000）内，否则裸读会 bus fault。
RTASYNCDTBBASE = "0x83000000"

# ── rt-async hart (core) assignment ─────────────────────────────────────────
# opensbi-amp.patch 的 fw_base.S 在第一条有效指令按 mhartid 分流（早于一切
# 代码、无栈），该值无法从 DT 获取（AP DTB 中不声明 hart 归属）。
RTASYNCHART = 1

# ── QEMU virt 定制外设（qemu-uart1.patch 定义虚拟硬件本身）──────────────────
UART1BASE = "0x10002000"
UART1IRQ  = 12
# chip-qemu-virt-rt 的 setup_console_irq 读回确认用（PLIC 已 DT probe，
# 待 plic_sifive 暴露 probed base 后可移除）。
PLICBASE  = "0x0C000000"

# ── Upstream repos ──────────────────────────────────────────────────────────

[opensbi]
repo   = "https://github.com/riscv-software-src/opensbi.git"
commit = "547a5bbda7c3ec0096a6c87809851f8c2df047d1"

[qemu_src]
repo   = "https://github.com/qemu/qemu.git"
commit = "f5a2438405d4ae8b62de7c9b39fac0b2155ee544"
