[workspace]
members = [
    "modules/chip-qemu-virt-rt",
    "modules/chip-k3-rt24",
    "modules/ov-channels",
    "modules/ov-rpc",
    "modules/ov-shm",
    "apps/rt-async-app",
    "apps/rt-async-k3",
    "user-apps/rtshm-abi",
    "user-apps/user-test-ipc",
    "user-apps/user-test-mbox",
    "user-apps/user-test-rpc",
    "user-apps/user-test-sched",
    "user-apps/user-test-bench",
    "user-apps/user-test-pbmt",
    "user-apps/robot-py",
    "user-apps/rtsh",
    "xtask",
]
resolver = "3"

[patch.crates-io]
# ov-channels vendor 补丁：feat/block-msg 分支（基于 feat/rt-async-amp）
# ——窗口原子 core 化（K3 专属 atomic-cas:false target）+ 0.3.0 块层
# （多块消息/CONT 续传位/字节流成帧）。详见
# modules/ov-channels/src/lib.rs 头注。
ov-channels = { path = "modules/ov-channels" }

[workspace.dependencies]
ov-channels = { version = "0.3.0", default-features = false, features = ["flags"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
